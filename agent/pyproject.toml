[project]
name = "rimagent"
version = "0.1.0"
description = "Qwen plays RimWorld through RimBridge and teaches itself"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rank-bm25>=0.2.2",
    "mwparserfromhell>=0.6",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "python-frontmatter>=1.1",
    "pillow>=12.3.0",
]

[project.scripts]
rimagent = "rimagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rimagent"]

[dependency-groups]
dev = ["pytest>=8"]
