# rimagent configuration
llm:
  base_url: http://127.0.0.1:8000/v1   # any OpenAI-compatible server with native tool calls (vLLM --enable-auto-tool-choice --tool-call-parser hermes)
  model: Qwen/Qwen3-32B                 # tested with Qwen 3.x 27-32B; put your real endpoint in config.local.yaml (gitignored)
  api_key: not-needed
  max_streams: 4
  thinking: true           # Qwen thinking mode for play/reflection steps
  max_tokens: 4000
  timeout_s: 240
bridge:
  url: http://127.0.0.1:8765
play:
  speed: 3                 # play speed between steps: 1 normal, 2 fast, 3 superfast
  think_speed: 3           # speed while thinking on calm steps (0 = pause, 1 normal, 2 fast, 3 superfast)
  danger_think_speed: 0    # speed while thinking on urgent steps (hostiles, downed/dead colonist, mental break, dialog, watcher/critical alerts)
  first_improve_day: 1     # first mid-episode improvement pass (skills/tools/watchers) this many days into a game
  improve_every_days: 3    # and then every N days
  wake_hours: 12           # scheduled think interval (in-game hours) when the model doesn't say
  min_wake_hours: 8        # floor for the model's own wake_in_hours (danger events/alerts bypass this)
  event_cooldown_hours: 3  # non-critical wake events are ignored this long after a step
  alert_wake_priorities: [Critical]   # game alerts that interrupt (plus any "idle colonist" alert); others wait for the next step
  alert_rewake_hours: 24   # the same alert label won't interrupt again for this long
  critical_kinds: [dialog, danger, manhunter, hostile_group, colonist_downed, colonist_died, mental_break, building_lost]
  max_tool_calls: 30       # per think step
  max_days: 60             # episode length cap
  autosave: true
  seeds: [rimagent-1, rimagent-2, rimagent-3, rimagent-4, rimagent-5]
  scenario: Crashlanded
  storyteller: Cassandra
  difficulty: Rough
  wake_on_kinds: [dialog, danger, manhunter, letter, incident, colonist_died, colonist_downed, mental_break, hostile_group, quest, building_lost]
dashboard:
  port: 8770
