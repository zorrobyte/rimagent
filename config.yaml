# rimagent configuration
llm:
  base_url: http://chaos-srv.tail0a9245.ts.net:18089/v1
  model: qwen3.8-27b-nvfp4-dflash2
  api_key: not-needed
  max_streams: 4
  thinking: true           # Qwen thinking mode for play/reflection steps
  max_tokens: 4000
  timeout_s: 900
bridge:
  url: http://127.0.0.1:8765
play:
  pause_to_think: true     # slow the game while the agent thinks (see think_speed); false = keep play speed
  think_speed: 1           # 0 = fully paused while thinking, 1 = normal speed, 2 = fast
  speed: 3                 # between steps: 1 normal, 2 fast, 3 superfast
  improve_every_days: 4    # mid-episode improvement pass cadence
  wake_hours: 6            # scheduled think interval (in-game hours)
  max_tool_calls: 30       # per think step
  max_days: 60             # episode length cap
  autosave: true
  seeds: [rimagent-1, rimagent-2, rimagent-3, rimagent-4, rimagent-5]
  scenario: Crashlanded
  storyteller: Cassandra
  difficulty: Rough
  wake_on_kinds: [dialog, letter, incident, colonist_died, colonist_downed, mental_break, hostile_group, quest, building_lost]
dashboard:
  port: 8770
